<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<body>
<h1 wicket:id="title"></h1>
<h2 wicket:id="headline"></h2>
<p wicket:id="note"></p>
<div wicket:id="closed"><span wicket:id="reason"></span></div>
<div wicket:id="locked"><span wicket:id="hint"></span> <a wicket:id="unlock">Unlock</a></div>
<a wicket:id="refresh">Refresh</a>
<a wicket:id="archive">Archive</a>
<div wicket:id="user"></div>
<ul>
    <li wicket:id="orders"><span wicket:id="customer"></span> <span wicket:id="number"></span></li>
</ul>
<table>
    <tr wicket:id="table"><td wicket:id="customer"></td></tr>
</table>
</body>
</html>
